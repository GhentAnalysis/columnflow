name: columnflow e2e setup
description: >-
  Shared setup of the end-to-end workflows (template_e2e.yaml, test_template_e2e.yaml): python,
  scratch directories, the CI test-data bundle (tests/ci/README.md) and the sandbox venv cache.
  Expects the repository to be checked out already.

inputs:
  testdata-tag:
    description: >-
      release tag of the CI test-data bundle; bump together with the release and testdata-sha256
      (tests/ci/README.md)
    required: true
  testdata-sha256:
    description: >-
      sha256 digest of the <testdata-tag>.tar.gz release asset, re-confirmed via
      `gh release view <tag> -R GhentAnalysis/columnflow --json assets`
    required: true
  venv-cache-key-prefix:
    description: prefix of the sandbox venv cache key, distinct per workflow so that each caches the venvs it needs
    required: true
  save-venv-cache:
    description: >-
      "true" to save the venv cache at the end of the job when it was missed, "false" to only restore
      it, e.g. in matrix jobs that should not race each other saving the same key
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup python 🐍
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Prepare scratch directories 📁
      shell: bash
      run: |
        # TMPDIR: the analysis setup.sh hardcodes /scratch/$USER/columnflow as a fallback, which does
        # not exist on GitHub-hosted runners; pre-export it to something writable
        echo "TMPDIR=${RUNNER_TEMP}/cf" >> "${GITHUB_ENV}"
        mkdir -p "${RUNNER_TEMP}/cf"

        # CF_SOFTWARE_BASE: pin explicitly so CF_VENV_BASE (CF_SOFTWARE_BASE/venvs) resolves to a
        # deterministic, cacheable path. "source setup.sh \"\"" runs the non-interactive default
        # setup (setup.sh's query() only prompts for a *named* setup), so nothing is queried
        # either way; without this the default would silently be $CF_DATA/software (setup.sh:385).
        echo "CF_SOFTWARE_BASE=${RUNNER_TEMP}/software" >> "${GITHUB_ENV}"

    - name: Cache CI test-data bundle 💾
      id: cache-testdata
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/testdata
        key: ${{ inputs.testdata-tag }}

    - name: Download CI test-data bundle 📥
      if: steps.cache-testdata.outputs.cache-hit != 'true'
      shell: bash
      env:
        TESTDATA_TAG: ${{ inputs.testdata-tag }}
        TESTDATA_SHA256: ${{ inputs.testdata-sha256 }}
      run: |
        mkdir -p "${RUNNER_TEMP}/testdata"
        url="https://github.com/GhentAnalysis/columnflow/releases/download/${TESTDATA_TAG}/${TESTDATA_TAG}.tar.gz"
        archive="${RUNNER_TEMP}/${TESTDATA_TAG}.tar.gz"

        # check the asset is reachable before downloading, so a missing release surfaces as an
        # actionable message rather than "curl: (22) 404" or a checksum mismatch on an HTML
        # error page
        if ! curl -fsSL --head "${url}" > /dev/null 2>&1; then
          echo "::error::CI test-data bundle not found at ${url}"
          echo "The end-to-end jobs need a test-data bundle published as a public GitHub Release"
          echo "asset. It cannot be generated on a runner: it contains the POG correctionlib"
          echo "JSONs (only available via /cvmfs, which is not mounted here, and with no"
          echo "anonymous public mirror) plus a truncated NanoAOD file."
          echo ""
          echo "Build and publish it once by following tests/ci/README.md, then re-run this job."
          exit 1
        fi

        # download to a file first, rather than piping straight into tar, so the digest can be
        # verified before anything is unpacked - an unverified 138 MB asset piped into tar would
        # silently unpack a corrupted or tampered download
        curl -fsSL "${url}" -o "${archive}"
        echo "${TESTDATA_SHA256}  ${archive}" | sha256sum -c -

        tar xzf "${archive}" -C "${RUNNER_TEMP}/testdata"
        rm -f "${archive}"

    - name: Export test-data location 🔧
      shell: bash
      run: echo "CF_CI_TESTDATA=${RUNNER_TEMP}/testdata" >> "${GITHUB_ENV}"

    # exact-key-or-rebuild, deliberately with no restore-keys fallback: a venv's install directory
    # name is derived from its sandbox *file path* (bin/cf_sandbox_file_hash.py), not from its
    # requirements content, and a version bump in a requirements file is only detected via a
    # hand-maintained "# version N" line that _setup_venv.sh, by default, just warns about and keeps
    # using the stale venv for. A loose restore-keys prefix match would happily restore that stale
    # venv on a cache miss for the exact key instead of rebuilding, silently reintroducing the very
    # staleness CF_SANDBOX_SETUP_MODE=update (set by the workflows) is meant to catch. Widened to
    # every sandboxes/*.txt, not just the ones the law tasks obviously use, since e.g.
    # venv_selection_eff.txt is pulled in transitively by cf.BTagEfficiency's sandbox.
    - name: Cache sandbox virtualenvs 💾
      if: inputs.save-venv-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/software/venvs
        key: ${{ inputs.venv-cache-key-prefix }}-${{ runner.os }}-${{ hashFiles('sandboxes/*.txt') }}

    - name: Restore sandbox virtualenvs 💾
      if: inputs.save-venv-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/software/venvs
        key: ${{ inputs.venv-cache-key-prefix }}-${{ runner.os }}-${{ hashFiles('sandboxes/*.txt') }}
