name: Publish on PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    # pinned instead of ubuntu-latest: python 3.9 (columnflow's default CF_PYTHON_VERSION) has no
    # actions/setup-python build for ubuntu 26.04, which ubuntu-latest points to now
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@master
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies ☕️
        run: |
          pip install -U pip
          pip install twine

      - name: Bundle 📦
        run: python setup.py sdist

      - name: Publish package 🐍
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
